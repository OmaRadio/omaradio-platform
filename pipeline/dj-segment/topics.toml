# Topic backlog for auto_dj.py -- Alan (Station Manager) picks from and
# writes an actual brief around one of these each cycle, rather than
# generating segments from a mechanical pull or an ungrounded LLM
# improvisation. Deliberately lightweight -- "writer's room prompts," not
# finished briefs; Alan does the real interpretive work of turning a seed
# into a specific, DJ-voiced brief.
#
# `djs` is optional -- omit it (or leave empty) for a topic either DJ can
# take. Restock this periodically: auto_dj.py skips a DJ's cycle and logs
# a warning if every entry suited to them has been used recently (see
# RECENT_SEGMENTS_WINDOW in auto_dj.py), rather than repeating stale ground.

